# GitHub Actions workflow for testing and continuous integration.
#
# This file performs testing using tox and tox.ini to define and configure the test environments.

name: CI Tests

on:
  schedule:
    # run every Wednesday at 6am UTC
    - cron: '0 6 * * 3'
  push:
    branches:
      - main
    tags:
    - '*'
  pull_request:
     branches: # only build on PRs against 'main' if you need to further limit when CI is run.
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names are required status checks on main, so they describe roles
  # ("oldest"/"current"/"latest" Python) rather than versions. When bumping
  # Python versions, change the tox envs below and default_python, not the names.
  # "current" is default_python; "latest" (devdeps) moves to a new Python first;
  # "threaded" is the free-threaded build of the current Python.
  #
  # Github Actions supports ubuntu, windows, and macos virtual environments:
  # https://help.github.com/en/actions/reference/virtual-environments-for-github-hosted-runners
  ci_tests:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@22ddf09dfabb443adddfb9f861b7d41a787d6b1a  # v3.0.3
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      submodules: false
      coverage: ''
      default_python: '3.14'
      envs: |
        - name: Code style checks
          linux: codestyle

        - name: Link checks
          linux: linkcheck

        - name: Linux - oldest Python, base dependencies
          linux: py312-test

        - name: Linux - intermediate Python, base dependencies
          linux: py313-test

        - name: Linux - oldest Python, oldest dependencies
          linux: py312-test-oldestdeps

        - name: Linux - threaded Python, base dependencies
          linux: py314t-test

        - name: macOS - current Python, base dependencies
          macos: py314-test

        - name: Windows - current Python, base dependencies
          windows: py314-test

        - name: Linux - current Python, all dependencies, remote data, coverage
          linux: py314-test-alldeps-cov
          toxargs: -v
          posargs: --remote-data=any
          coverage: codecov

        - name: Linux - current Python, image comparison tests
          linux: py314-test-image
          artifact-path: results/

  allowed_failures:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@22ddf09dfabb443adddfb9f861b7d41a787d6b1a  # v3.0.3
    with:
      submodules: false
      coverage: ''
      default_python: '3.14'
      envs: |
        - name: (Allowed Failure) Linux - latest Python, dev dependencies, remote data
          linux: py315-test-devdeps
          posargs: --remote-data=any --verbose
