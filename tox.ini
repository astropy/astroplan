[tox]
envlist =
    py{312,313,314}-test{,-alldeps,-devdeps,-oldestdeps}{,-cov}
    py{314t,315t}-test{,-alldeps,-devdeps}
    py314-test-image
    py315-test-devdeps
    build_docs
    linkcheck
    codestyle
requires =
    tox >= 4
    tox-uv >= 1.35

[testenv]

# Suppress display of matplotlib plots generated during docs build
setenv =
    MPLBACKEND=agg
    devdeps: UV_EXTRA_INDEX_URL = https://pypi.anaconda.org/astropy/simple https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
    # Consider every index for every package (pip's behaviour), since the
    # nightly indexes only carry some packages or some of their builds.
    devdeps: UV_INDEX_STRATEGY = unsafe-best-match
    # Coverage.py must write its data file to the repo root (not the tox
    # changedir below) for the CI's Codecov upload step to find it.
    cov: COVERAGE_FILE={toxinidir}/.coverage
    oldestdeps: UV_CONSTRAINT = {toxinidir}/oldestdeps-constraints.txt
    # Keep the GIL disabled on free-threaded builds (as astropy does): pyerfa
    # doesn't declare free-threading support yet, so importing it would
    # re-enable the GIL with a RuntimeWarning, which filterwarnings turns into an error
    py314t,py315t: PYTHON_GIL = 0
    # Only run the image comparison tests, against the baseline images in
    # astroplan/plots/tests/baseline_images
    image: MPLFLAGS = --mpl -m mpl_image_compare --mpl-generate-summary=html --mpl-results-path={toxinidir}/results
    !image: MPLFLAGS =

# Pass through the following environment variables which may be needed for the CI
passenv = HOME,WINDIR,LC_ALL,LC_CTYPE,CC,CI

# Run the tests in a temporary directory to make sure that we don't import
# this package from the source tree
changedir = .tmp/{envname}

# tox environments are constructed with so-called 'factors' (or terms)
# separated by hyphens, e.g. test-devdeps-cov. Lines below starting with factor:
# will only take effect if that factor is included in the environment name. To
# see a list of example environments that can be run, along with a description,
# run:
#
#     tox -l -v
#
description =
    run tests
    alldeps: with all optional dependencies
    devdeps: with the latest developer version of key dependencies
    oldestdeps: with the oldest supported versions of all dependencies
    cov: and test coverage
    image: with image comparison tests
    py314t,py315t: on free-threaded Python

# The following provides some specific pinnings for key packages
deps =

    devdeps: numpy>=0.0.dev0
    # Falls back to the latest release on Pythons the nightly index doesn't
    # build yet (e.g. matplotlib on 3.15 pre-releases)
    devdeps: matplotlib>=0.0.dev0
    devdeps: astropy>=0.0.dev0

    # Not a dependency, but user-supplied pytz timezones must keep working
    alldeps: pytz

    # Baseline images were generated with this matplotlib version; bump it
    # together with regenerating them, as rendering changes between releases
    image: matplotlib==3.11.2

# The following indicates which optional dependencies will be installed
extras =
    test
    alldeps, oldestdeps: all

commands =
    {list_dependencies_command}
    !cov: pytest --pyargs astroplan {toxinidir}/docs {env:MPLFLAGS} {posargs}
    cov: pytest --pyargs astroplan {toxinidir}/docs --cov astroplan --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml

pip_pre =
    devdeps: true

# oldestdeps resolves every requirement, including transitive ones, to the
# lowest version allowed by the declared lower bounds, so the minimum versions
# in pyproject.toml are what get tested rather than hand-maintained pins.
# Lower bounds for transitive dependencies live in oldestdeps-constraints.txt
# (applied via UV_CONSTRAINT above).
uv_resolution =
    oldestdeps: lowest

[testenv:build_docs]
changedir = docs
description = invoke sphinx-build to build the HTML docs
extras = docs
commands =
    {list_dependencies_command}
    sphinx-build -W -b html . _build/html

[testenv:linkcheck]
changedir = docs
description = check the links in the HTML docs
extras = docs
commands =
    {list_dependencies_command}
    sphinx-build -W -b linkcheck . _build/html

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style, e.g., with flake8
deps = flake8
commands = flake8 astroplan --count
